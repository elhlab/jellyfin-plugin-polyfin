overview: "Per-user metadata language across your libraries"
description: >
  Shows movie metadata in each viewer's own language, instead of one
  language for the whole library. Works by intercepting Jellyfin's item
  responses and fetching metadata in that language from the providers
  already configured in your library (TMDb, TVDb, etc).
