services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: polyfin-test-jellyfin
    # Rebuilds the fake library in /media (see scripts/seed-media.sh), then starts Jellyfin as usual.
    entrypoint:
      - /bin/sh
      - -c
      - /bin/sh /seed-media.sh --yes /media && exec /jellyfin/jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ./docker/config:/config
      - ./docker/cache:/cache
      - ./docker/media:/media
      - ./scripts/seed-media.sh:/seed-media.sh:ro
      # Drop-in plugin mount: rebuild the plugin (dotnet build), then just
      # restart this container to pick up the new DLL. Must be read-write -
      # Jellyfin writes its own meta.json into this folder on first load.
      - ./Jellyfin.Plugin.Polyfin/bin/Debug/net10.0:/config/plugins/Polyfin
